name: Build and storage safety tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publishable source
        run: python3 scripts/check-repository.py --staged

  linux:
    name: Linux (sanitizers ${{ matrix.sanitizers }})
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["OFF", "ON"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config libgtk-4-dev libadwaita-1-dev \
            libssl-dev libglib2.0-dev-bin xvfb xauth dbus-x11 \
            qemu-system-x86 seabios dpkg-dev file
      - name: Configure C++20 build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DKAVRUNE_BUILD_DESKTOP=ON
          -DKAVRUNE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Compile
        run: cmake --build build --parallel 2
      - name: File-only safety tests and synthetic BIOS boot
        run: ctest --test-dir build --output-on-failure --timeout 90
      - name: Desktop smoke test
        if: matrix.sanitizers == 'OFF'
        env:
          GTK_A11Y: none
          GSETTINGS_BACKEND: memory
        run: dbus-run-session -- xvfb-run -a ./build/kavrune --smoke-test
      - name: Build development Debian package
        if: matrix.sanitizers == 'OFF'
        working-directory: build
        run: cpack -G DEB
      - name: Upload development package
        if: matrix.sanitizers == 'OFF'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kavrune-ubuntu-24.04-development
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
