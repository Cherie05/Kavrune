name: Build and storage safety tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test publication identity checks
        run: python3 tests/test_repository_privacy.py
      - name: Test disposable PPA source packaging
        run: python3 tests/test_ppa_packaging.py
      - name: Check publishable source
        run: python3 scripts/check-repository.py --staged --history

  linux:
    name: Linux (sanitizers ${{ matrix.sanitizers }})
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["OFF", "ON"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build and test dependencies
        run: |
          # Keep the runner's Ubuntu HTTPS fallbacks and existing archive keys.
          # Its preferred Azure HTTP mirror can download too slowly for this job.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y \
            build-essential cmake pkg-config libgtk-4-dev libadwaita-1-dev \
            libssl-dev libglib2.0-dev-bin libseccomp2 xvfb xauth dbus-x11 \
            qemu-system-x86 seabios dpkg-dev debhelper file appstream desktop-file-utils
      - name: Desktop metadata
        run: |
          desktop-file-validate data/org.kavrune.Kavrune.desktop
          appstreamcli validate --no-net data/org.kavrune.Kavrune.metainfo.xml
      - name: Configure C++20 build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DKAVRUNE_BUILD_DESKTOP=ON
          -DKAVRUNE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Safety tests, GTK drive selection and synthetic BIOS boot
        run: ctest --test-dir build --output-on-failure --timeout 90
      - name: Desktop smoke test
        if: matrix.sanitizers == 'OFF'
        env:
          GTK_A11Y: none
          GSETTINGS_BACKEND: memory
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a ./build/kavrune --smoke-test
      - name: Build development Debian package
        if: matrix.sanitizers == 'OFF'
        working-directory: build
        run: cpack -G DEB
      - name: Verify extracted package, payload lifecycle and guarded offline operation
        if: matrix.sanitizers == 'OFF'
        run: |
          for package in build/*.deb; do
            python3 scripts/check-package.py "$package" --self-test --offline --report build/offline-package-check.json
          done
      - name: Create scoped dependency inventory and unsigned release provenance
        if: matrix.sanitizers == 'OFF'
        run: |
          python3 scripts/sbom.py build/sbom.spdx.json
          python3 scripts/release-manifest.py --output build/release-manifest.json build/kavrune_*.deb build/sbom.spdx.json build/offline-package-check.json
          cd build
          sha256sum kavrune_*.deb sbom.spdx.json offline-package-check.json release-manifest.json > SHA256SUMS
      - name: Build and verify Ubuntu PPA source and binary packaging
        if: matrix.sanitizers == 'OFF'
        run: |
          python3 scripts/prepare-ppa.py --maintainer-name 'Kavrune CI Fixture' --maintainer-email packaging@example.invalid --output build/ppa-validation
          cd build/ppa-validation/kavrune-*
          dpkg-buildpackage -S -sa -us -uc
          cd ..
          dpkg-source --no-check -x ./*.dsc roundtrip
          cd roundtrip
          DEB_BUILD_OPTIONS=parallel=2 dpkg-buildpackage -b -us -uc
          cd ../../..
          python3 scripts/check-package.py build/ppa-validation/kavrune_*_amd64.deb --debian-revision 0ubuntu1~beta1~noble1 --self-test --offline --report build/ppa-validation/offline-report.json
      - name: Upload development package
        if: matrix.sanitizers == 'OFF'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kavrune-ubuntu-24.04-development
          path: |
            build/*.deb
            build/sbom.spdx.json
            build/offline-package-check.json
            build/release-manifest.json
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
